services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: >
      sh -c "npm install --no-audit --no-fund --loglevel=error &&
             npm run dev --workspace frontend"
    environment:
      VITE_DOCKER_DEV: '1'
      VITE_API_PROXY: http://api:3000
    ports: !override
      - '5173:5173'
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
      - web_frontend_node_modules:/app/frontend/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  web_node_modules:
  web_frontend_node_modules:
